name: Archive Heimgeist after freeze

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/archive-after-freeze.yml

permissions:
  contents: read

jobs:
  archive:
    name: Archive frozen Heimgeist repository
    if: github.repository == 'heimgewebe/heimgeist'
    runs-on: ubuntu-latest
    steps:
      - name: Create Heimgewebe GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.HEIMGEWEBE_APP_ID }}
          private-key: ${{ secrets.HEIMGEWEBE_APP_PRIVATE_KEY }}
          owner: heimgewebe
          repositories: heimgeist

      - name: Verify freeze, archive, and read back
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: heimgewebe/heimgeist
          EXPECTED_FREEZE: 4b92bae2c684860399b333cd908878726e6ef4e8
        run: |
          set -euo pipefail

          current_head="$(gh api "repos/${TARGET_REPO}/branches/main" --jq .commit.sha)"
          if [[ "${current_head}" != "${GITHUB_SHA}" ]]; then
            echo "main moved during archive attempt: expected ${GITHUB_SHA}, got ${current_head}" >&2
            exit 1
          fi

          current_archived="$(gh api "repos/${TARGET_REPO}" --jq .archived)"
          if [[ "${current_archived}" == "true" ]]; then
            echo "Repository is already archived; no mutation needed."
            exit 0
          fi

          compare_status="$(gh api "repos/${TARGET_REPO}/compare/${EXPECTED_FREEZE}...${GITHUB_SHA}" --jq .status)"
          case "${compare_status}" in
            ahead|identical)
              ;;
            *)
              echo "Archive refused: ${EXPECTED_FREEZE} is not an ancestor of ${GITHUB_SHA} (status=${compare_status})." >&2
              exit 1
              ;;
          esac

          gh api --method PATCH "repos/${TARGET_REPO}" -F archived=true >/dev/null

          archived="$(gh api "repos/${TARGET_REPO}" --jq .archived)"
          post_head="$(gh api "repos/${TARGET_REPO}/branches/main" --jq .commit.sha)"
          if [[ "${archived}" != "true" || "${post_head}" != "${GITHUB_SHA}" ]]; then
            echo "Archive readback failed: archived=${archived}, main=${post_head}, expected=${GITHUB_SHA}" >&2
            exit 1
          fi

          {
            echo "## Heimgeist archive readback"
            echo "- archived: true"
            echo "- main: ${post_head}"
            echo "- freeze ancestor: ${EXPECTED_FREEZE}"
          } >> "${GITHUB_STEP_SUMMARY}"
