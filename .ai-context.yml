---
ai_context_version: 1.1

project:
  name: heimgeist
  summary: "Decommissioned historical reference for the former Heimgewebe system-reflection meta-agent."
  role: archived_reference
  primary_language: typescript
  visibility: internal

heimgewebe:
  axis:
    - Events
    - Semantik
    - Decisions
    - Learning
    - OS-Context
  fleet:
    enabled: false
  wgx:
    profile_expected: false
    guard_smoke_expected: false

interfaces:
  consumes: []
  produces: []

contracts:
  schemas:
    - path: "src/types/index.ts"
      note: "Historical TypeScript contract surface; not current ecosystem authority."

dependencies:
  internal: []
  external:
    - name: node
      version: ">=20"
      note: "Required only to reproduce the historical implementation locally."

architecture:
  entrypoints:
    - "src/cli/index.ts"
  key_paths:
    - path: "src/core/"
      purpose: "Historical Core Loop implementation"
    - path: "docs/"
      purpose: "Historical architecture and design record"
  data_flow:
    input: "Historical repository contents only"
    processing: "No active runtime contract"
    output: "No active ecosystem output"

boundaries:
  not_responsible_for:
    - "Production authority"
    - "Task or claim state"
    - "Runtime execution"
    - "Event delivery"
    - "Current ecosystem semantics"
    - "Agent orchestration"
  dangerous_assumptions:
    - "Treating historical Heimgeist documents as current architecture."
    - "Re-enabling retired Plexer or command-dispatch integrations."

conventions:
  branching: "historical reference; no feature development"
  commit_prefix: "HEIMGEWEBE"
  ci_platform: github_actions

documentation:
  runbook: README.md

ai_guidance:
  do:
    - "Treat this repository as historical evidence and preserve provenance."
    - "Route current responsibilities to Grabowski, Bureau, Chronik, Systemkatalog, RepoGround, Plexer or Leitstand as appropriate."
  dont:
    - "Add new features or runtime authority here."
    - "Use this repository as current system truth."
    - "Re-enable Heimgeist event production, Plexer fanout or command dispatch."
